{% if form.non_field_errors %}
<div class="aviso-toast error" role="alert" style="margin-bottom:18px;">
  {{ form.non_field_errors }}
</div>
{% endif %}

{% for field in form %}
<div class="form-grupo">
  <label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}
    <span style="color:var(--rojo);">*</span>
    {% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
  <small style="color:var(--texto-apagado); font-size:0.8rem; margin-top:2px;">{{ field.help_text|safe }}</small>
  {% endif %}

  {% if field.errors %}
  <div class="form-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>
  {% endif %}
</div>
{% endfor %}
