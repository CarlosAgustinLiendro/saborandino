{% extends 'base.html' %}

{% block title %}Página no encontrada (404) · {{ organizacion_nombre }}{% endblock %}

{% block content %}
<div style="max-width:540px; margin:60px auto; text-align:center;">
  <div class="formulario-card" style="padding:48px 32px;">
    <div style="font-size:3.5rem; margin-bottom:12px;">🔍</div>
    <span style="font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--naranja);">Error 404</span>
    <h1 style="font-size:1.8rem; font-weight:800; color:var(--texto); margin:6px 0 12px 0;">Página no encontrada</h1>
    <p style="color:var(--texto-secundario); font-size:0.95rem; margin-bottom:24px;">
      El recurso solicitado no existe o la dirección ingresada no es correcta.
    </p>
    <a href="{% url 'inicio:home' %}" class="btn btn-principal">Volver al inicio</a>
  </div>
</div>
{% endblock %}
